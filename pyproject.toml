[project]
name = "skill-hub"
version = "0.1.0"
description = "Starter kit for running your own agent-skill marketplace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
skill-hub = "skill_hub.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
