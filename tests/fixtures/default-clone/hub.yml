# Your hub's identity. Every skill-hub command reads this file.
# Change name and repo_url first: `skill-hub qa` warns while they are the defaults.
hub:
  name: my-skill-hub            # kebab-case: a-z, 0-9 and single hyphens
  display_name: My Skill Hub
  owner: Your Team
  description: Skills for our team's coding agents.
  repo_url: https://github.com/you/your-hub

qa:
  # Extra top-level SKILL.md frontmatter keys to accept. Leave empty to keep every
  # skill installable everywhere; add e.g. when_to_use only if you target Claude Code alone.
  allow_keys: []

site:
  # The marketplace page that `skill-hub build` writes. Keep every value quoted:
  # an unquoted #4f46e5 is a YAML comment, not a colour.
  accent: ""     # hex colour for links and highlights, e.g. "#4f46e5"; empty = the theme's default
  logo_url: ""   # https:// URL or a path relative to the page; empty = no logo
  theme: ""      # your theme folder, relative to this file; empty = the built-in default

deploy:
  # Where CI publishes the marketplace page on every push to main. Empty = never deploy.
  # Built in: github-pages, s3, rsync. See "Deploying the marketplace page" in KIT.md.
  # Keys and SSH keys go in your repository's Actions secrets, never in this file.
  target: ""
  s3:
    bucket: ""
    endpoint: ""   # empty = AWS; set for R2, MinIO or B2, e.g. "https://<account-id>.r2.cloudflarestorage.com"
    region: ""     # e.g. "us-east-1"; R2 uses "auto"
  rsync:
    host: ""
    user: ""
    path: ""       # the folder on the server, e.g. "/var/www/skills"
    port: 22
